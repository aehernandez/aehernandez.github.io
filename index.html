<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Personal website of Alain Hernandez, featuring professional links, interactive tools, and passion projects. Simulated inside a retro 3D CRT terminal environment.">
    <title>Retro 3D Terminal Environment</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="180x180" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050508;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        /* --- ADVANCED CRT SHADER EFFECTS --- */
        .crt-screen {
            background-color: #020a02;
            color: #33ff33;
            box-sizing: border-box;
            border-radius: 40px 40px 40px 40px / 30px 30px 30px 30px;
            position: relative;
            overflow: hidden;
            border: 6px solid #000;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 1);
            animation: textShadow 1.6s infinite, crtFlicker 0.15s infinite;
        }

        .crt-noise {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            opacity: 0.1;
            pointer-events: none;
        }

        .crt-screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 6px, 6px 100%;
            pointer-events: none;
        }

        .crt-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 15%;
            background: linear-gradient(to bottom, rgba(51, 255, 51, 0), rgba(51, 255, 51, 0.1) 50%, rgba(51, 255, 51, 0));
            z-index: 3;
            animation: scanlineRoll 6s linear infinite;
            pointer-events: none;
        }

        .glow-text {
            text-shadow:
                0 0 8px rgba(51, 255, 51, 0.8),
                2px 0 1px rgba(255, 0, 0, 0.4),
                -2px 0 1px rgba(0, 0, 255, 0.4);
        }

        @keyframes scanlineRoll {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(800%);
            }
        }

        @keyframes crtFlicker {
            0% {
                opacity: 0.95;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.98;
            }
        }

        .terminal-content {
            padding: 50px 70px;
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            filter: contrast(1.2) brightness(1.1);
        }

        .crt-link {
            display: inline-block;
            color: #33ff33;
            text-decoration: none;
            padding: 10px 20px;
            margin: 15px 0;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            z-index: 20;
        }

        .crt-link:hover {
            background-color: #33ff33;
            color: #020a02;
            border-color: #33ff33;
            text-shadow: none;
            box-shadow: 0 0 30px rgba(51, 255, 51, 0.8);
            transform: scale(1.02);
        }

        .blink {
            animation: blinker 1s step-start infinite;
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }

        #message-box {
            backdrop-filter: blur(5px);
        }

        .modal-crt {
            background: repeating-linear-gradient(0deg, #051405, #051405 2px, #0a200a 2px, #0a200a 4px);
            box-shadow: 0 0 50px rgba(51, 255, 51, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.8);
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="webgl-container" class="absolute inset-0 z-10 pointer-events-none"></div>
    <div id="css3d-container" class="absolute inset-0 z-20"></div>

    <div id="message-box"
        class="hidden fixed inset-0 items-center justify-center bg-black/70 z-50 transition-opacity duration-300 opacity-0">
        <div
            class="modal-crt border-4 border-[#33ff33] p-8 rounded-lg max-w-lg w-[90%] font-mono text-[#33ff33] relative overflow-hidden">
            <div class="absolute inset-0 bg-[rgba(51,255,51,0.05)] pointer-events-none z-0"></div>
            <h2 id="msg-title" class="text-3xl mb-6 font-bold drop-shadow-[0_0_8px_rgba(51,255,51,0.8)] relative z-10">>
                EXECUTE</h2>
            <div id="msg-content" class="mb-8 text-xl opacity-90 leading-relaxed relative z-10 whitespace-pre-line">
                Loading sector...
            </div>
            <div class="flex justify-end relative z-10">
                <button id="msg-close"
                    class="px-6 py-3 bg-transparent border-2 border-[#33ff33] text-[#33ff33] font-bold text-xl hover:bg-[#33ff33] hover:text-[#051405] transition-all focus:outline-none shadow-[0_0_15px_rgba(51,255,51,0.4)]">
                    [ TERMINATE ]
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

        // --- Generate Static Noise Canvas ---
        function generateNoise() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(canvas.width, canvas.height);
            for (let i = 0; i < imgData.data.length; i += 4) {
                const val = Math.random() * 255;
                imgData.data[i] = val; imgData.data[i + 1] = val; imgData.data[i + 2] = val; imgData.data[i + 3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
            return canvas.toDataURL();
        }

        // --- UI Logic ---
        const msgBox = document.getElementById('message-box');
        const msgTitle = document.getElementById('msg-title');
        const msgContent = document.getElementById('msg-content');

        function showMessage(title, content) {
            msgTitle.innerText = `> ${title.toUpperCase()}.EXE`;
            msgContent.innerText = content;
            msgBox.classList.remove('hidden');
            void msgBox.offsetWidth; // Reflow
            msgBox.classList.remove('opacity-0');
            msgBox.classList.add('opacity-100');
        }

        document.getElementById('msg-close').addEventListener('click', () => {
            msgBox.classList.remove('opacity-100');
            msgBox.classList.add('opacity-0');
            setTimeout(() => msgBox.classList.add('hidden'), 300);
        });

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-10, 10, 55);

        const webglRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        webglRenderer.setSize(window.innerWidth, window.innerHeight);
        webglRenderer.setPixelRatio(window.devicePixelRatio);
        webglRenderer.shadowMap.enabled = true;
        webglRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
        webglRenderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.getElementById('webgl-container').appendChild(webglRenderer.domElement);

        const cssRenderer = new CSS3DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('css3d-container').appendChild(cssRenderer.domElement);

        const controls = new OrbitControls(camera, cssRenderer.domElement);

        // Allow orbiting and zooming within constraints, but keep panning disabled to lock the target
        controls.enableRotate = true;
        controls.enableZoom = true;
        controls.enablePan = false;

        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minAzimuthAngle = -Math.PI / 2.2;
        controls.maxAzimuthAngle = Math.PI / 2.2;
        controls.minPolarAngle = Math.PI / 6;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.maxDistance = 120;
        controls.minDistance = 25;
        controls.target.set(0, 10, 0);

        // --- Lighting ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.05));

        // Desk Lamp Cast (Warm)
        const deskLampLight = new THREE.SpotLight(0xffaa55, 300);
        deskLampLight.position.set(28, 32, 10);
        deskLampLight.target.position.set(5, 0, 15);
        deskLampLight.angle = Math.PI / 4.5;
        deskLampLight.penumbra = 0.6;
        deskLampLight.decay = 1.6;
        deskLampLight.distance = 200;
        deskLampLight.castShadow = true;
        deskLampLight.shadow.mapSize.width = 2048;
        deskLampLight.shadow.mapSize.height = 2048;
        deskLampLight.shadow.bias = -0.001;
        scene.add(deskLampLight);
        scene.add(deskLampLight.target);

        // Screen Glow (Green)
        const screenGlow = new THREE.PointLight(0x33ff33, 100, 50);
        screenGlow.position.set(0, 15, 12);
        screenGlow.castShadow = true;
        scene.add(screenGlow);

        // Neon Backlight
        const neonBacklight = new THREE.PointLight(0xff00aa, 200, 150);
        neonBacklight.position.set(-15, 15, -25);
        scene.add(neonBacklight);

        // --- Materials ---
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x2e180d, roughness: 0.9, metalness: 0.05 });
        const plasticMat = new THREE.MeshStandardMaterial({ color: 0xd4cebc, roughness: 0.7, metalness: 0.1 });
        const darkPlasticMat = new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.9 });
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0f, roughness: 1.0 });

        // --- Environment Modeling ---

        // Desk & Wall
        const desk = new THREE.Mesh(new THREE.BoxGeometry(140, 2, 80), woodMat);
        desk.position.set(0, -1, 10);
        desk.receiveShadow = true;
        scene.add(desk);

        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(200, 120), wallMat);
        backWall.position.set(0, 59, -25);
        backWall.receiveShadow = true;
        scene.add(backWall);

        // Neon Retro Grid on Wall
        const gridGeo = new THREE.PlaneGeometry(160, 100, 25, 15);
        const gridMat = new THREE.MeshBasicMaterial({ color: 0xff00aa, wireframe: true, transparent: true, opacity: 0.15 });
        const neonGrid = new THREE.Mesh(gridGeo, gridMat);
        neonGrid.position.set(0, 49, -24.8);
        scene.add(neonGrid);

        // --- Props Modeling ---

        // Coffee mug
        const mugGroup = new THREE.Group();
        mugGroup.position.set(-16, 0, 8);
        mugGroup.rotation.y = Math.PI / 3;
        scene.add(mugGroup);

        const ceramicMat = new THREE.MeshStandardMaterial({ color: 0xefefef, roughness: 0.1, side: THREE.DoubleSide });
        const mugSides = 16;
        // Saucer
        const saucer = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 2.5, 0.4, mugSides), ceramicMat);
        saucer.position.y = 0.2;
        saucer.castShadow = true;
        //saucer.receiveShadow = true;
        mugGroup.add(saucer);

        // Hollow Mug Body
        const mugBody = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 4.5, mugSides, 1, true), ceramicMat);
        mugBody.position.y = 2.65;
        mugBody.castShadow = true;
        //mugBody.receiveShadow = true;
        mugGroup.add(mugBody);

        const coffee = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.9, 3.8, mugSides), new THREE.MeshStandardMaterial({ color: 0x1f0d05, roughness: 0.1 }));
        coffee.position.y = 2.4;
        mugGroup.add(coffee);

        const handle = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.3, 6, 12), ceramicMat);
        handle.position.set(-2, 2.8, 0);
        handle.rotation.z = Math.PI / 2;
        handle.castShadow = true;
        mugGroup.add(handle);

        // Steam Particles
        const steamParticles = [];
        const steamGeo = new THREE.PlaneGeometry(2, 2);
        const steamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false });
        for (let i = 0; i < 4; i++) {
            const p = new THREE.Mesh(steamGeo, steamMat);
            p.position.set(0, 4.5, 0);
            mugGroup.add(p);
            steamParticles.push({ mesh: p, life: Math.random() * 100 });
        }

        // --- Monitor & Keyboard Modeling ---
        const monitorGroup = new THREE.Group();
        monitorGroup.position.set(0, 13.5, -2);
        scene.add(monitorGroup);

        const casing = new THREE.Mesh(new THREE.BoxGeometry(22, 17, 18), plasticMat);
        casing.castShadow = true; casing.receiveShadow = true;
        monitorGroup.add(casing);

        monitorGroup.add(new THREE.Mesh(new THREE.BoxGeometry(19.8, 14.8, 18.6), new THREE.MeshStandardMaterial({ color: 0x020a02 })));

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.5, 4, 16), plasticMat);
        neck.position.set(0, 3, -2);
        neck.castShadow = true; scene.add(neck);

        const monBase = new THREE.Mesh(new THREE.BoxGeometry(12, 1.5, 12), plasticMat);
        monBase.position.set(0, 0.75, -2);
        monBase.castShadow = true; monBase.receiveShadow = true; scene.add(monBase);

        // Keyboard
        const kbGroup = new THREE.Group();
        kbGroup.position.set(0, 0.125, 18);
        kbGroup.rotation.x = 0.05;
        scene.add(kbGroup);

        const kbBase = new THREE.Mesh(new THREE.BoxGeometry(24, 1.5, 7), plasticMat);
        kbBase.castShadow = true; kbBase.receiveShadow = true; kbGroup.add(kbBase);
        kbBase.position.z = -0.5

        const keyGeo = new THREE.BoxGeometry(0.85, 0.6, 0.85);
        const keyMat = new THREE.MeshStandardMaterial({ color: 0xe0dcd0, roughness: 0.8 });
        const specialKeyMat = new THREE.MeshStandardMaterial({ color: 0xbcbcbc, roughness: 0.8 });

        const startX = -10.5; const startZ = -3; const spacing = 1.1;
        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 20; col++) {
                if (row === 4 && (col > 4 && col < 14)) continue;
                const key = new THREE.Mesh(keyGeo, (col === 0 || col === 19 || row === 0 || col === 18) ? specialKeyMat : keyMat);
                key.position.set(startX + col * spacing, 0.8, startZ + row * spacing);
                key.castShadow = true; kbGroup.add(key);
            }
        }
        const spaceBar = new THREE.Mesh(new THREE.BoxGeometry(9, 0.6, 0.85), keyMat);
        spaceBar.position.set(startX + 9 * spacing, 0.8, startZ + 4 * spacing);
        spaceBar.castShadow = true; kbGroup.add(spaceBar);

        // --- CSS3D Screen Setup ---
        const screenDiv = document.createElement('div');
        screenDiv.className = 'crt-screen';
        screenDiv.style.width = '1200px';
        screenDiv.style.height = '880px';

        screenDiv.innerHTML = `
            <div class="crt-noise" style="background-image: url(${generateNoise()})"></div>
            <div class="terminal-content glow-text">
                <div style="font-size: 35px; margin-bottom: 25px; color: #88ff88;">
                    Alain Hernandez™ ROM BIOS Version 1.10 A04<br>
                    Copyright (C) 1993-2026 Indigo Technologies Ltd.<br><br>
                    640K Base Memory, 07168K Extended<br>
                    System Configuration Updated...
                </div>
                <div style="font-size: 35px; margin-top: 30px; margin-bottom: 30px; font-weight: bold;">
                    C:\\USER\\GUEST> DIR *.EXE
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-start; font-size: 35px; font-weight: bold;">
                    <a class="crt-link" data-target="linkedin">LINKEDIN.EXE &lt;DIR&gt;</a>
                    <a class="crt-link" data-target="emotion">EMOTION_WHEEL.EXE &lt;DIR&gt;</a>
                    <a class="crt-link" data-target="projects">COMING_SOON.DAT &lt;DIR&gt;</a>
                </div>
            </div>
        `;

        screenDiv.querySelectorAll('.crt-link').forEach(link => {
            link.addEventListener('pointerdown', (e) => e.stopPropagation());
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const t = link.getAttribute('data-target');

                if (t === 'linkedin') {
                    window.open('https://www.linkedin.com/in/alainehernandez/', '_blank');
                    return;
                }

                if (t === 'emotion') {
                    window.open('./emotion-wheel', '_blank');
                    return;
                }

                let c = "";
                if (t === 'projects') c = "> MOUNTING NETWORK DRIVE Z:\n> COMPILING REPOSITORIES...\n\n[ SUCCESS ] 0 Errors, 0 Warnings.";
                showMessage(t, c);
            });
        });

        const cssObject = new CSS3DObject(screenDiv);
        cssObject.position.set(0, 13.5, 7.35);
        cssObject.scale.set(0.0155, 0.0155, 0.0155);
        scene.add(cssObject);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            webglRenderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Raycaster for Mug Interaction ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        window.addEventListener('pointermove', (event) => {
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObject(mugGroup, true);

            document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
        });

        window.addEventListener('click', (event) => {
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObject(mugGroup, true);

            if (intersects.length > 0) {
                window.open('https://fablecoffee.com', '_blank');
            }
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            screenGlow.intensity = 100 + Math.random() * 5;

            // Animate Steam
            steamParticles.forEach(p => {
                p.life += 1;
                if (p.life > 100) p.life = 0;

                // Float up and drift slightly
                p.mesh.position.y = 4.5 + (p.life * 0.03);
                p.mesh.position.x = Math.sin(p.life * 0.1) * 0.2;

                // Fade in and out
                let opacity = 0;
                if (p.life < 20) opacity = p.life / 20; // fade in
                else if (p.life > 60) opacity = 1 - ((p.life - 60) / 40); // fade out
                else opacity = 1;

                p.mesh.material.opacity = opacity * 0.15; // Max opacity 0.15

                // Ensure steam always faces camera
                p.mesh.quaternion.copy(camera.quaternion);
            });

            webglRenderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
